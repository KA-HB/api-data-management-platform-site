<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Search Data</title><link rel="stylesheet" href="../css/styles.css"></head>
<body><div class="app-shell"><aside class="sidebar"><div class="brand">Data Platform</div><nav class="nav"><a href="./user-dashboard.html">Dashboard</a><a href="./my-datasets.html">My Datasets</a><a class="active" href="./search.html">Search Data</a><a href="./api-keys.html">API Keys</a><a href="./api-docs.html">API Docs</a><button data-logout>Logout</button></nav></aside>
<main class="content"><h1>Search Data</h1><section class="panel"><form id="search-form" class="toolbar"><label>Dataset <select id="dataset"></select></label><label>Keyword <input id="term" placeholder="Name, ID, date, status"></label><label>Exact field <input id="exact-key" placeholder="json field name"></label><label>Exact value <input id="exact-value" placeholder="exact value"></label><label>Start date <input id="start-date" type="date"></label><label>End date <input id="end-date" type="date"></label><label>User <input id="user-filter" placeholder="user ID, email, username"></label><label>Employee <input id="employee-filter" placeholder="employee ID or name"></label><label>Job code <input id="jobcode-filter" placeholder="job code ID or name"></label><label>Status <input id="status-filter" placeholder="active, archived, approved"></label><label>Customer/project <input id="customer-filter" placeholder="customer, client, project"></label><label>Sort <select id="sort-field"><option value="created_at">Created</option><option value="dataset">Dataset</option></select></label><label>Direction <select id="sort-direction"><option value="desc">Newest first</option><option value="asc">Oldest first</option></select></label><label>Page size <input id="page-size" type="number" min="1" max="250" value="50"></label><button type="button" id="run-search">Search</button><button type="button" class="secondary" id="clear-search">Clear</button><button type="button" class="secondary" id="export-json">Export JSON</button></form></section>
<section class="panel"><div class="section-head"><h2>Records</h2><p id="result-summary">Run a search to load records.</p></div><div class="table-wrap"><table><thead><tr><th>Dataset</th><th>ID</th><th>Record</th><th>Created</th></tr></thead><tbody id="records-body"></tbody></table></div><div class="pager"><button class="secondary" id="prev-page" type="button">Previous</button><span id="page-status">Page 1</span><button class="secondary" id="next-page" type="button">Next</button></div></section></main></div><script type="module" src="../js/search.js"></script></body></html>
