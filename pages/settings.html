<body><div class="app-shell"><aside class="sidebar"><div class="brand">Data Platform</div><nav class="nav"><a href="./admin-dashboard.html">Dashboard</a><a href="./qbtime.html">QuickBooks Time</a><a class="active" href="./settings.html">Settings</a><button data-logout>Logout</button></nav></aside><main class="content"><h1>System Settings</h1><section class="panel"><h2>Configuration</h2><p>Configure Supabase URL, anon key, Edge Function environment variables, RLS policies, scheduled sync secrets, and deployment settings from the project files and Supabase dashboard.</p></section><section class="panel"><h2>Security Checklist</h2><div class="checklist"><label><input type="checkbox"> Logged-out browser redirects away from every dashboard page.</label><label><input type="checkbox"> Logged-out Supabase requests to protected tables return no data.</label><label><input type="checkbox"> Non-admin users cannot open admin pages or call admin Edge Functions.</label><label><input type="checkbox"> Users can only see datasets allowed by RLS and dataset permissions.</label><label><input type="checkbox"> Frontend files contain no Supabase service role key or QuickBooks Time secrets.</label><label><input type="checkbox"> QuickBooks Time tokens are not readable through browser Supabase queries.</label><label><input type="checkbox"> API keys are displayed once, stored as hashes, and validated server-side only.</label><label><input type="checkbox"> Invalid or missing API tokens receive 401 responses from Edge Functions.</label><label><input type="checkbox"> Test all checks in a private/incognito browser while logged out.</label></div></section></main></div><script type="module">import{requireAuth,renderShell}from"../js/auth.js";const p=await requireAuth("admin");if(p)renderShell(p);</script></body></html>
